# Optional hot-reload path; the base Compose file serves built frontend assets.
services:
  web:
    image: sealed-web-dev
    build:
      target: build
    command: npm run dev -- --host 0.0.0.0 --port 5173
    volumes:
      - ./apps/web/src:/app/apps/web/src:ro
      - ./apps/web/vite.config.js:/app/apps/web/vite.config.js:ro
      - ./packages/web/client.js:/app/packages/web/client.js:ro
    healthcheck:
      disable: true
  target-web:
    image: sealed-target-web-dev
    build:
      target: build
    command: npm run dev -- --host 0.0.0.0 --port 5174
    volumes:
      - ./apps/target-web/src:/app/apps/target-web/src:ro
      - ./apps/target-web/vite.config.js:/app/apps/target-web/vite.config.js:ro
      - ./packages/web/client.js:/app/packages/web/client.js:ro
    healthcheck:
      disable: true
