services:
  redis:
    image: redis:7-alpine@sha256:ee64a64eaab618d88051c3ade8f6352d11531fcf79d9a4818b9b183d8c1d18ba
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 20

  target:
    build:
      context: .
      dockerfile: apps/target/Dockerfile
    init: true
    restart: unless-stopped
    stop_grace_period: 15s
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      REDIS_URL: redis://redis:6379/0
      UNSEAL_TOKEN_FILE: /run/sealed-auth/unseal-token
    volumes:
      - sealed-auth:/run/sealed-auth
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/ready', timeout=2)",
        ]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s

  worker:
    build:
      context: .
      dockerfile: apps/target/Dockerfile
    command: python -m sealed_target.worker
    init: true
    restart: unless-stopped
    stop_grace_period: 15s
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "sealed_target.readiness"]
      interval: 3s
      timeout: 3s
      retries: 3
      start_period: 5s

  control:
    # One control owner; SQLite history lives independently of faulted Redis.
    container_name: sealed-control
    init: true
    restart: unless-stopped
    stop_grace_period: 20s
    build:
      context: .
      dockerfile: apps/control/Dockerfile
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      TARGET_URL: http://target:8080
      CONTROL_OWNER_FILE: /data/control.owner
      STORE_PATH: /data/sealed.sqlite3
      UNSEAL_TOKEN_FILE: /run/sealed-auth/unseal-token
      CATALOG_PATH: /app/experiments/catalog.yaml
      POLICY_PATH: /app/experiments/policy.yaml
      FIXTURES_PATH: /app/fixtures/seals
      PLANNER: ${PLANNER:-stub}
      ALLOW_PLANNER_NETWORK: ${ALLOW_PLANNER_NETWORK:-false}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - sealed-auth:/run/sealed-auth:ro
      - control-data:/data
      - ./experiments:/app/experiments:ro
      - ./fixtures:/app/fixtures:ro
    depends_on:
      target:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health', timeout=2)",
        ]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s

  web:
    init: true
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      CONTROL_URL: http://control:8081
      TARGET_URL: http://target:8080
      TARGET_APP_URL: ${TARGET_APP_URL:-http://localhost:5174}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 3

  target-web:
    init: true
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/target-web/Dockerfile
    ports:
      - "127.0.0.1:5174:5174"
    environment:
      TARGET_URL: http://target:8080
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5174/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 3

volumes:
  # Generated by target bootstrap; never mounted in either browser container.
  sealed-auth:
  control-data:
