name: Quality

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: packages/*.lock.txt
      - run: python -m pip install -r packages/dev.lock.txt
      - run: python -m pip install --no-deps --no-build-isolation -e packages/agent -e apps/control -e apps/target
      - run: python -m pip check
      - run: python -m ruff check start.py apps/control apps/target packages/agent
      - run: python -m mypy
      - run: python -m pytest -q --tb=short

  frontend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [web, target-web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json
      - run: npm ci
        working-directory: apps/${{ matrix.app }}
      - run: npm run lint
        working-directory: apps/${{ matrix.app }}
      - run: npm run format:check
        working-directory: apps/${{ matrix.app }}
      - run: npm test
        working-directory: apps/${{ matrix.app }}
      - run: npm run build
        working-directory: apps/${{ matrix.app }}

  compose:
    runs-on: ubuntu-latest
    needs: [python, frontend]
    timeout-minutes: 30
    env:
      PLANNER: stub
      ALLOW_PLANNER_NETWORK: 'false'
      XAI_API_KEY: ''
      LLM_BASE_URL: ''
      LLM_API_KEY: ''
      LLM_MODEL: ''
      BROWSER_RESULTS_PATH: docs/D_PACKAGED_BROWSER_RESULTS.json
      BROWSER_SCREENSHOT_PREFIX: d-packaged
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: docker compose up --build -d --wait --wait-timeout 180
      - run: docker compose exec -T target python < apps/target/tests/redis_integration.py
      - run: docker compose exec -T control python < apps/control/tests/compose_acceptance_a.py
      - run: docker compose exec -T control python - smoke < apps/control/tests/compose_acceptance_b.py
      - run: docker compose exec -T control python < apps/control/tests/compose_acceptance_d.py
      - run: npm --prefix apps/web run test:browser -- live
      - run: npm --prefix apps/web run test:browser -- target-race
      - run: npm --prefix apps/web run test:browser -- target-invalid
      - run: npm --prefix apps/web run test:rendered -- full
      - name: Replay without live services
        run: |
          docker compose stop control target worker redis target-web
          BROWSER_RESULTS_PATH=docs/D_REPLAY_BROWSER_RESULTS.json npm --prefix apps/web run test:browser -- replay
      - name: Capture service diagnostics
        if: failure()
        run: docker compose logs --no-color --tail=200
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compose-browser-evidence
          path: |
            docs/*BROWSER_RESULTS.json
            docs/*RENDERED_RESULTS.json
            docs/*AUDIT.json
            docs/screenshots/
      - run: docker compose down --volumes
        if: always()
