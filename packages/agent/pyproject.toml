[project]
name = "sealed-agent"
version = "0.1.0"
description = "Sealed planner — proposes drafts only"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
llm = ["openai>=1.40"]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
